<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listado de Productos</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dashboard_style.css">
  <script src="dashboard.js"></script>
</head>
<body>
  <div class="dashboard-container">
    <header>
      <span>Gestor de turnos</span>
      <div>
        <button class="menu">&#9776;</button>
        <button id="logout">Cerrar Sesión</button>
      </div>
    </header>
    <nav id="sidebar">
      <ul>
        <li><a href="#">Panel</a></li>
      </ul>
    </nav>
    <main>
      <h1>Pacientes</h1>
      <div class="buttons-add">
        <button id="add-doctor"><img src="icons/plus-solid-full.svg" alt="" class="icon-dashboard-button">Agregar nuevo doctor</button>
        <button id="add-speciality"><img src="icons/shapes-solid-full.svg" alt="" class="icon-dashboard-button">Agregar nueva especialidad</button>
      </div>
      <div class="cards-status">
        <div id="card-doctors">
          <div class="top-card">
            <div class="icon-card"><img src="icons/briefcase-medical-solid-full.svg" alt="" class="icon-dashboard-button"></div>
            <div class="variant-status">+4 este mes</div>
          </div>
          <div class="bottom-card">
            <p>Doctores activos</p>
            <h5>124</h5>
          </div>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Paciente</th>
          </tr>
        </thead>
        <tbody id="product-table-body">
          <!-- Los productos se cargarán aquí dinámicamente -->
        </tbody>
      </table>
    </main>
    <footer>Mi Aplicación &copy; 2024</footer>
  </div>
</body>
</html>

            <h1 class="title">Registrar Nueva Especialidad</h1>
            <p class="subtitle">
                Complete la información técnica y administrativa para dar de alta una
                especialidad médica en el sistema hospitalario.
            </p>

            <!-- Tarjeta con el formulario -->
            <section class="card">
                <form id="form-especialidad" novalidate>
                    <div class="field">
                        <label for="nombre">Nombre de la Especialidad</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej. Cardiología Intervencionista"
                            required>
                        <small class="error" id="nombre-error"></small>
                    </div>

                    <div class="field">
                        <label for="descripcion">Descripción</label>
                        <textarea id="descripcion" name="descripcion" rows="6"
                            placeholder="Detalle el alcance de la especialidad, procedimientos principales y requisitos de derivación..."></textarea>
                    </div>

                    <div class="field">
                        <label for="estado">Estado inicial</label>
                        <select id="estado" name="estado">
                            <option value="activo">Activo - Disponible para programación</option>
                            <option value="inactivo">Inactivo - No disponible</option>
                        </select>
                    </div>

                    <div class="actions">
                        <button type="button" class="btn btn--secondary" id="btn-cancelar">Cancelar</button>
                        <button type="submit" class="btn btn--primary">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                <path
                                    d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zm-5 16a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm3-10H5V5h10v4z" />
                            </svg>
                            Guardar Especialidad
                        </button>
                    </div>
                </form>
            </section>
        </main>
